<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 0;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 24px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #0984e3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
        }

        .user-info {
            flex: 1;
        }

        .user-info h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #0984e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info p {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            background: #141414;
            border-radius: 12px;
            padding: 6px;
        }

        .tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .tab.active {
            background: #6c5ce7;
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .tab:hover {
            color: white;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .prompt-section {
            background: #141414;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1a1a1a;
        }

        .prompt-section label {
            font-size: 14px;
            color: #888;
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .prompt-input {
            width: 100%;
            padding: 16px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            line-height: 1.6;
        }

        .prompt-input:focus {
            border-color: #6c5ce7;
        }

        .prompt-input::placeholder {
            color: #444;
        }

        .btn-generate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6c5ce7, #0984e3);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
        }

        .btn-generate:hover {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid #6c5ce7;
            border-radius: 16px;
            padding: 16px 20px;
            color: white;
            text-align: center;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 1000;
            max-width: 400px;
            margin: 0 auto;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #6c5ce7;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
                padding-bottom: 90px;
            }
            .tab {
                font-size: 12px;
                padding: 10px 6px;
            }
            .prompt-input {
                min-height: 100px;
                font-size: 14px;
                padding: 14px;
            }
            .btn-generate {
                font-size: 15px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar" id="avatarDisplay">👤</div>
        <div class="user-info">
            <h1 id="userName">Добро пожаловать!</h1>
            <p>UnSkippable Generator</p>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="avatar">
            Аватар
        </button>
        <button class="tab" data-tab="preview">
            Превью
        </button>
        <button class="tab" data-tab="cards">
            Карточки
        </button>
    </div>

    <div class="tab-content active" id="tab-avatar">
        <div class="prompt-section">
            <label>Опиши аватар (промпт)</label>
            <textarea class="prompt-input" id="avatarPrompt" placeholder="Например: красивый закат на пляже, стиль арт, 4k..."></textarea>
            <button class="btn-generate" onclick="generateImage('avatar')">Сгенерировать аватар</button>
        </div>
    </div>

    <div class="tab-content" id="tab-preview">
        <div class="prompt-section">
            <label>Опиши изображение (промпт)</label>
            <textarea class="prompt-input" id="previewPrompt" placeholder="Например: космический корабль в стиле киберпанк, 4k..."></textarea>
            <button class="btn-generate" onclick="generateImage('preview')">Сгенерировать превью</button>
        </div>
    </div>

    <div class="tab-content" id="tab-cards">
        <div class="prompt-section">
            <label>Опиши карточку (промпт)</label>
            <textarea class="prompt-input" id="cardPrompt" placeholder="Например: визитка для бизнеса, минимализм, элегантно..."></textarea>
            <button class="btn-generate" onclick="generateImage('card')">Сгенерировать карточку</button>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastMessage">Результат отправлен в ЛС!</span>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const user = tg?.initDataUnsafe?.user;
        const userName = user?.first_name || user?.username || 'Гость';
        const userId = user?.id || 'неизвестно';

        document.getElementById('userName').textContent = `Добро пожаловать, ${userName}!`;

        const avatarDisplay = document.getElementById('avatarDisplay');
        const initials = userName.charAt(0).toUpperCase() || '👤';
        avatarDisplay.textContent = initials;

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                const target = document.getElementById(`tab-${this.dataset.tab}`);
                if (target) target.classList.add('active');
            });
        });

        function generateImage(type) {
            let prompt = '';
            let typeName = '';

            if (type === 'avatar') {
                prompt = document.getElementById('avatarPrompt').value.trim();
                typeName = 'Аватар';
                if (!prompt) {
                    showToast('Введите описание аватара!');
                    document.getElementById('avatarPrompt').focus();
                    return;
                }
            } else if (type === 'preview') {
                prompt = document.getElementById('previewPrompt').value.trim();
                typeName = 'Превью';
                if (!prompt) {
                    showToast('Введите описание изображения!');
                    document.getElementById('previewPrompt').focus();
                    return;
                }
            } else if (type === 'card') {
                prompt = document.getElementById('cardPrompt').value.trim();
                typeName = 'Карточка';
                if (!prompt) {
                    showToast('Введите описание карточки!');
                    document.getElementById('cardPrompt').focus();
                    return;
                }
            }

            const btn = document.querySelector(`#tab-${type} .btn-generate`);
            if (btn) {
                btn.textContent = 'Генерация...';
                btn.disabled = true;
            }

            setTimeout(() => {
                if (tg) {
                    tg.sendData("1");
                }

                showToast('Результат отправлен в ЛС!');

                if (btn) {
                    btn.textContent = `Сгенерировать ${type === 'avatar' ? 'аватар' : type === 'preview' ? 'превью' : 'карточку'}`;
                    btn.disabled = false;
                }

                if (type === 'avatar') document.getElementById('avatarPrompt').value = '';
                else if (type === 'preview') document.getElementById('previewPrompt').value = '';
                else if (type === 'card') document.getElementById('cardPrompt').value = '';

            }, 1500);
        }

        let toastTimeout;

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.querySelectorAll('.prompt-input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    const parent = input.closest('.tab-content');
                    const btn = parent?.querySelector('.btn-generate');
                    if (btn) btn.click();
                }
            });
        });

        setTimeout(() => {
            showToast(`Добро пожаловать, ${userName}!`);
        }, 500);
    </script>
</body>
</html>
